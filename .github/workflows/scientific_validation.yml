name: Scientific validation

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  scientific:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      JUPYTER_PREFER_ENV_PATH: '1'
      POETRY_VIRTUALENVS_IN_PROJECT: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install poetry==2.1.1
      - run: poetry install --all-extras --no-interaction
      - run: poetry run pytest tests/ -m scientific --junitxml=scientific-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scientific-results
          path: scientific-results.xml
